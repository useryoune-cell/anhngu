<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ếch vui vẻ - Lingo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --pond-dark: #2d6a4f;
        --pond-mid: #40916c;
        --pond-light: #74c69d;
        --pad: #52b788;
        --pad-dark: #2d6a4f;
        --pad-hi: #b7e4c7;
        --frog: #70e000;
        --frog-dark: #38b000;
        --frog-hi: #ccff33;
        --good: #52b788;
        --bad: #e63946;
        --slate: #23323a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--slate);
        font-family: "Nunito", "Quicksand", system-ui, sans-serif;
        background:
          radial-gradient(circle at 12% 12%, rgba(183, 228, 199, 0.55), transparent 32%),
          linear-gradient(135deg, #d8f3dc 0%, #95d5b2 48%, #74c69d 100%);
      }

      .frog-page {
        width: min(1180px, calc(100% - 28px));
        margin: 0 auto;
        padding: 22px 0 36px;
      }

      .frog-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 16px;
      }

      .frog-brand {
        color: #174232;
        font-size: clamp(26px, 4vw, 42px);
        font-weight: 900;
        line-height: 1;
        text-decoration: none;
        text-shadow: 0 3px 0 rgba(255, 255, 255, 0.46);
      }

      .frog-back,
      .frog-reset {
        border: 0;
        border-radius: 999px;
        color: #ffffff;
        background: linear-gradient(135deg, #2d6a4f, #40916c);
        box-shadow: 0 7px 0 rgba(45, 106, 79, 0.2);
        cursor: pointer;
        font: inherit;
        font-weight: 900;
        padding: 11px 18px;
        text-decoration: none;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .frog-back:hover,
      .frog-reset:hover,
      .frog-back:focus-visible,
      .frog-reset:focus-visible {
        outline: none;
        transform: translateY(-3px);
        box-shadow: 0 10px 0 rgba(45, 106, 79, 0.18);
      }

      .frog-title {
        display: grid;
        gap: 5px;
        margin-bottom: 14px;
      }

      .frog-title span {
        color: #2d6a4f;
        font-size: 14px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0;
      }

      .frog-title h1 {
        margin: 0;
        color: #183c32;
        font-size: clamp(28px, 5vw, 58px);
        line-height: 0.95;
      }

      .frog-stage {
        position: relative;
        overflow: hidden;
        border: 2px solid rgba(183, 228, 199, 0.7);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.34);
        box-shadow: 0 18px 0 rgba(45, 106, 79, 0.12);
      }

      #frogCanvas {
        display: block;
        width: 100%;
        height: 500px;
      }

      .frog-progress {
        position: absolute;
        top: 14px;
        left: 50%;
        z-index: 3;
        display: flex;
        gap: 7px;
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.54);
        backdrop-filter: blur(12px);
        transform: translateX(-50%);
      }

      .pad-dot {
        position: relative;
        width: 24px;
        height: 16px;
        border-radius: 60% 42% 58% 44%;
        background: rgba(82, 183, 136, 0.3);
        box-shadow: inset -3px -2px 0 rgba(45, 106, 79, 0.18);
        transform: rotate(-10deg);
      }

      .pad-dot.is-filled {
        background: #52b788;
        box-shadow: inset -3px -2px 0 rgba(45, 106, 79, 0.28), 0 0 12px rgba(82, 183, 136, 0.78);
      }

      .frog-question-card {
        position: relative;
        z-index: 2;
        margin-top: 20px;
        padding: 22px;
        border: 1px solid rgba(255, 255, 255, 0.62);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.65);
        box-shadow: 0 16px 36px rgba(24, 60, 50, 0.13);
        backdrop-filter: blur(14px);
      }

      .frog-question-card.is-shaking {
        animation: shake-card 460ms ease;
      }

      .frog-question-kicker {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        margin-bottom: 10px;
        padding: 5px 12px;
        border-radius: 999px;
        color: #ffffff;
        background: #2d6a4f;
        font-size: 14px;
        font-weight: 900;
      }

      .frog-question-card h2 {
        margin: 0 0 16px;
        color: var(--slate);
        font-size: clamp(21px, 3vw, 32px);
        line-height: 1.18;
      }

      .frog-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 13px;
      }

      .frog-option {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        min-height: 58px;
        border: 2px solid rgba(82, 183, 136, 0.24);
        border-radius: 999px;
        color: #1e2f36;
        background: rgba(255, 255, 255, 0.74);
        cursor: pointer;
        font: inherit;
        font-size: 17px;
        font-weight: 900;
        padding: 11px 18px;
        text-align: left;
        transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
      }

      .frog-option i {
        display: grid;
        place-items: center;
        flex: 0 0 34px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        color: #ffffff;
        background: #40916c;
        font-style: normal;
      }

      .frog-option:hover,
      .frog-option:focus-visible {
        outline: none;
        transform: translateY(-4px);
        border-color: rgba(82, 183, 136, 0.64);
        box-shadow: 0 10px 22px rgba(45, 106, 79, 0.13);
      }

      .frog-option.is-correct {
        border-color: var(--good);
        box-shadow: 0 0 0 4px rgba(82, 183, 136, 0.16), 0 0 24px rgba(82, 183, 136, 0.38);
      }

      .frog-option.is-wrong {
        border-color: var(--bad);
        box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.12);
        animation: shake-card 420ms ease;
      }

      .frog-option[disabled] {
        cursor: default;
      }

      .frog-mark {
        margin-left: auto;
        font-size: 22px;
      }

      .frog-overlay {
        position: fixed;
        inset: 0;
        z-index: 12;
        display: none;
        place-items: center;
        padding: 20px;
        background: rgba(21, 46, 39, 0.45);
        backdrop-filter: blur(7px);
      }

      .frog-overlay.is-visible {
        display: grid;
      }

      .frog-score-card {
        width: min(430px, 100%);
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.66);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 22px 50px rgba(11, 38, 29, 0.22);
        text-align: center;
      }

      .frog-score-card h2 {
        margin: 0 0 10px;
        color: #183c32;
        font-size: 34px;
      }

      .frog-score-card p {
        margin: 0 0 18px;
        color: #2f4952;
        font-size: 18px;
        font-weight: 800;
      }

      .frog-stars {
        margin-bottom: 18px;
        color: #f6bd2f;
        font-size: 34px;
        letter-spacing: 0;
        text-shadow: 0 3px 0 rgba(246, 189, 47, 0.22);
      }

      @keyframes shake-card {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-8px); }
        40% { transform: translateX(7px); }
        60% { transform: translateX(-5px); }
        80% { transform: translateX(4px); }
      }

      @media (max-width: 720px) {
        .frog-page {
          width: min(100% - 16px, 1180px);
          padding-top: 12px;
        }

        .frog-topbar {
          align-items: flex-start;
        }

        #frogCanvas {
          height: 460px;
        }

        .frog-progress {
          gap: 4px;
          padding: 7px;
        }

        .pad-dot {
          width: 18px;
          height: 12px;
        }

        .frog-question-card {
          padding: 16px;
        }

        .frog-options {
          grid-template-columns: 1fr;
        }

        .frog-option {
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="frog-page">
      <header class="frog-topbar">
        <a class="frog-brand" href="{{ url_for('home') }}">Lingo</a>
        <a class="frog-back" href="{{ url_for('quizz') }}">Quay lại</a>
      </header>

      <section class="frog-title">
        <span>{{ package['difficulty'] }}</span>
        <h1>Ếch vui vẻ</h1>
      </section>

      <section class="frog-stage" aria-label="Ao lá sen">
        <div class="frog-progress" aria-label="Tiến độ">
          {% for index in range(1, 11) %}
            <span class="pad-dot" data-progress-dot="{{ index }}"></span>
          {% endfor %}
        </div>
        <canvas id="frogCanvas" width="1180" height="500"></canvas>
      </section>

      <section class="frog-question-card" id="questionCard">
        <span class="frog-question-kicker" id="questionKicker">Nhảy đến lá sen số 1</span>
        <h2 id="questionText"></h2>
        <div class="frog-options" id="options"></div>
      </section>
    </main>

    <div class="frog-overlay" id="resultOverlay" role="dialog" aria-modal="true">
      <article class="frog-score-card">
        <h2 id="resultTitle">Hoàn thành</h2>
        <p id="resultText"></p>
        <div class="frog-stars" id="resultStars" aria-label="Số sao"></div>
        <button class="frog-reset" type="button" id="playAgain">Chơi lại</button>
      </article>
    </div>

    <script>
      const gameQuestions = {{ questions|tojson }};

      const canvas = document.getElementById("frogCanvas");
      const ctx = canvas.getContext("2d");
      const questionCard = document.getElementById("questionCard");
      const questionKicker = document.getElementById("questionKicker");
      const questionText = document.getElementById("questionText");
      const optionsBox = document.getElementById("options");
      const overlay = document.getElementById("resultOverlay");
      const resultTitle = document.getElementById("resultTitle");
      const resultText = document.getElementById("resultText");
      const resultStars = document.getElementById("resultStars");
      const playAgain = document.getElementById("playAgain");
      const dots = Array.from(document.querySelectorAll("[data-progress-dot]"));

      const state = {
        width: 1180,
        height: 500,
        index: 0,
        correct: 0,
        frog: { x: 92, y: 385, scale: 1, facing: 1, dizzy: false },
        jump: null,
        splash: null,
        bloom: -1,
        bloomStart: 0,
        won: false,
        gameOver: false,
        locked: false,
        fireworks: [],
        fireflies: [],
        dragonflies: [],
        ripples: [],
        bankGrass: [],
        bankFlowers: [],
        reeds: [[], []]
      };

      const lilyPads = [
        { x: 188, y: 380, r: 44, angle: -0.22 },
        { x: 288, y: 330, r: 40, angle: 0.15 },
        { x: 390, y: 378, r: 43, angle: -0.1 },
        { x: 492, y: 315, r: 39, angle: 0.24 },
        { x: 590, y: 365, r: 45, angle: -0.16 },
        { x: 684, y: 305, r: 38, angle: 0.12 },
        { x: 780, y: 356, r: 42, angle: -0.26 },
        { x: 870, y: 298, r: 39, angle: 0.18 },
        { x: 960, y: 345, r: 41, angle: -0.1 },
        { x: 1042, y: 288, r: 39, angle: 0.22 }
      ];

      function fitCanvas() {
        const rect = canvas.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        state.width = rect.width;
        state.height = rect.height;
        canvas.width = Math.round(rect.width * ratio);
        canvas.height = Math.round(rect.height * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        positionFrog();
      }

      function px(point) {
        return {
          x: point.x / 1180 * state.width,
          y: point.y / 500 * state.height,
          r: point.r / 1180 * state.width,
          angle: point.angle
        };
      }

      function positionFrog() {
        if (state.jump) return;
        if (state.index <= 0) {
          state.frog.x = 92 / 1180 * state.width;
          state.frog.y = 385 / 500 * state.height;
          state.frog.facing = 1;
          return;
        }
        if (state.index > lilyPads.length) {
          state.frog.x = 1112 / 1180 * state.width;
          state.frog.y = 278 / 500 * state.height;
          state.frog.facing = 1;
          return;
        }
        const pad = px(lilyPads[state.index - 1]);
        state.frog.x = pad.x;
        state.frog.y = pad.y - pad.r * 0.72;
      }

      function seedAmbient() {
        state.fireflies = Array.from({ length: 26 }, (_, i) => ({
          x: Math.random() * state.width,
          y: 110 + Math.random() * (state.height * 0.65),
          phase: Math.random() * Math.PI * 2,
          speed: 0.45 + Math.random() * 0.8,
          win: i > 10
        }));
        state.dragonflies = Array.from({ length: 5 }, () => ({
          x: Math.random() * state.width,
          y: 94 + Math.random() * 135,
          phase: Math.random() * Math.PI * 2,
          speed: 0.25 + Math.random() * 0.36
        }));
        state.ripples = Array.from({ length: 14 }, () => ({
          x: Math.random() * state.width,
          y: state.height * 0.55 + Math.random() * state.height * 0.3,
          radius: 8 + Math.random() * 34,
          phase: Math.random() * Math.PI * 2
        }));
        state.bankGrass = Array.from({ length: 26 }, () => 0.58 + Math.random() * 0.28);
        state.bankFlowers = Array.from({ length: 20 }, (_, i) => ({
          x: 0.86 + Math.random() * 0.13,
          y: 0.5 + Math.random() * 0.36,
          color: ["#f4a7c6", "#f6bd60", "#b7e4c7", "#ffd166"][i % 4]
        }));
        state.reeds = [
          Array.from({ length: 38 }, (_, i) => ({ base: 0.48 + Math.random() * 0.08, height: 58 + (i % 5) * 10, phase: Math.random() * Math.PI * 2 })),
          Array.from({ length: 32 }, (_, i) => ({ base: 0.48 + Math.random() * 0.08, height: 58 + (i % 5) * 10, phase: Math.random() * Math.PI * 2 }))
        ];
      }

      function drawScene(time) {
        const w = state.width;
        const h = state.height;
        const sky = ctx.createLinearGradient(0, 0, 0, h * 0.55);
        sky.addColorStop(0, "#d8f3dc");
        sky.addColorStop(0.56, "#b7e4c7");
        sky.addColorStop(1, "#f2c078");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        drawSunsetGlow(w, h);
        drawTrees(w, h, time);
        drawWater(w, h, time);
        drawBanks(w, h);
        drawReeds(w, h, time);
        drawFog(w, h, time);
        drawLilyPads(time);
        drawDragonflies(time);
        drawFireflies(time);
        drawFrog(time);
        drawSplash(time);
        drawFireworks(time);
      }

      function drawSunsetGlow(w, h) {
        const glow = ctx.createRadialGradient(w * 0.78, h * 0.28, 12, w * 0.78, h * 0.28, w * 0.42);
        glow.addColorStop(0, "rgba(255, 213, 128, 0.48)");
        glow.addColorStop(1, "rgba(255, 213, 128, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);
      }

      function drawTrees(w, h, time) {
        ctx.save();
        ctx.fillStyle = "#1f4d36";
        const base = h * 0.48;
        for (let i = -1; i < 17; i++) {
          const x = i * (w / 15) + Math.sin(time * 0.0005 + i) * 5;
          const treeH = h * (0.18 + (i % 4) * 0.026);
          ctx.beginPath();
          ctx.moveTo(x - 58, base);
          ctx.quadraticCurveTo(x - 34, base - treeH * 0.72, x, base - treeH);
          ctx.quadraticCurveTo(x + 34, base - treeH * 0.72, x + 58, base);
          ctx.closePath();
          ctx.fill();
          ctx.fillRect(x - 8, base - 18, 16, 32);
        }
        ctx.fillStyle = "rgba(33, 79, 47, 0.34)";
        ctx.fillRect(0, base - 8, w, 30);
        ctx.restore();
      }

      function drawWater(w, h, time) {
        const waterTop = h * 0.43;
        const water = ctx.createLinearGradient(0, waterTop, 0, h);
        water.addColorStop(0, "#74c69d");
        water.addColorStop(0.4, "#40916c");
        water.addColorStop(1, "#2d6a4f");
        ctx.fillStyle = water;
        ctx.beginPath();
        ctx.moveTo(0, waterTop);
        for (let x = 0; x <= w; x += 18) {
          ctx.lineTo(x, waterTop + Math.sin(x * 0.02 + time * 0.001) * 8);
        }
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();

        ctx.lineWidth = 1.6;
        for (let i = 0; i < 11; i++) {
          const y = waterTop + 20 + i * 22;
          ctx.strokeStyle = `rgba(183, 228, 199, ${0.13 + i * 0.006})`;
          ctx.beginPath();
          for (let x = -20; x <= w + 20; x += 16) {
            const wave = Math.sin(x * 0.028 + time * 0.0017 + i) * 5;
            if (x === -20) ctx.moveTo(x, y + wave);
            else ctx.lineTo(x, y + wave);
          }
          ctx.stroke();
        }

        for (const ripple of state.ripples) {
          const pulse = 1 + Math.sin(time * 0.002 + ripple.phase) * 0.18;
          ctx.strokeStyle = "rgba(216, 243, 220, 0.2)";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.ellipse(ripple.x, ripple.y, ripple.radius * pulse, ripple.radius * 0.32 * pulse, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      function drawBanks(w, h) {
        ctx.save();
        ctx.fillStyle = "#5aaa46";
        ctx.beginPath();
        ctx.moveTo(0, h * 0.54);
        ctx.bezierCurveTo(w * 0.05, h * 0.46, w * 0.11, h * 0.59, w * 0.16, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#95d46a";
        for (let i = 0; i < 26; i++) {
          const x = (i / 25) * w * 0.16;
          const y = h * state.bankGrass[i];
          ctx.beginPath();
          ctx.ellipse(x, y, 5, 18, -0.3, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = "#808d77";
        ctx.beginPath();
        ctx.moveTo(w * 0.88, h * 0.48);
        ctx.quadraticCurveTo(w * 0.96, h * 0.4, w, h * 0.54);
        ctx.lineTo(w, h);
        ctx.lineTo(w * 0.82, h);
        ctx.quadraticCurveTo(w * 0.86, h * 0.62, w * 0.88, h * 0.48);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#6f806d";
        for (let i = 0; i < 9; i++) {
          ctx.beginPath();
          ctx.ellipse(w * (0.86 + i * 0.018), h * (0.66 + (i % 3) * 0.05), 28, 15, i * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }

        state.bankFlowers.forEach((flower) => {
          const x = w * flower.x;
          const y = h * flower.y;
          ctx.strokeStyle = "#2d6a4f";
          ctx.beginPath();
          ctx.moveTo(x, y + 14);
          ctx.lineTo(x, y);
          ctx.stroke();
          ctx.fillStyle = flower.color;
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      function drawReeds(w, h, time) {
        ctx.save();
        for (let side = 0; side < 2; side++) {
          const start = side ? w * 0.8 : 0;
          const reeds = state.reeds[side];
          for (let i = 0; i < reeds.length; i++) {
            const reed = reeds[i];
            const x = start + (side ? i * w * 0.006 : i * w * 0.005);
            const base = h * reed.base;
            const reedH = reed.height;
            const sway = Math.sin(time * 0.001 + reed.phase) * 5;
            ctx.strokeStyle = "#235f3e";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x, base + 38);
            ctx.quadraticCurveTo(x + sway, base - reedH * 0.4, x + sway * 1.5, base - reedH);
            ctx.stroke();
            if (i % 5 === 0) {
              ctx.fillStyle = "#8b5e34";
              ctx.beginPath();
              ctx.ellipse(x + sway * 1.5, base - reedH - 10, 5, 18, 0, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
        ctx.restore();
      }

      function drawFog(w, h, time) {
        ctx.save();
        ctx.fillStyle = "rgba(255, 255, 255, 0.16)";
        for (let i = 0; i < 7; i++) {
          const x = ((time * 0.012 + i * 190) % (w + 220)) - 110;
          const y = h * (0.48 + (i % 3) * 0.06);
          ctx.beginPath();
          ctx.ellipse(x, y, 90, 13, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawLilyPads(time) {
        lilyPads.forEach((raw, i) => {
          const pad = px(raw);
          const glow = state.bloom === i ? Math.max(0, 1 - (time - state.bloomStart) / 850) : 0;
          ctx.save();
          ctx.translate(pad.x, pad.y);
          ctx.rotate(pad.angle + Math.sin(time * 0.001 + i) * 0.025);
          ctx.fillStyle = "#2d6a4f";
          ctx.beginPath();
          ctx.ellipse(0, 0, pad.r * 1.36, pad.r * 0.82, 0, 0.22, Math.PI * 2 + 0.18);
          ctx.lineTo(0, 0);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "#52b788";
          ctx.beginPath();
          ctx.ellipse(-2, -3, pad.r * 1.2, pad.r * 0.72, 0, 0.2, Math.PI * 2 + 0.15);
          ctx.lineTo(0, 0);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "#b7e4c7";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(-pad.r * 0.55, -pad.r * 0.18, -pad.r * 0.95, -pad.r * 0.02);
          ctx.stroke();
          if (glow > 0 || state.won) {
            ctx.shadowColor = "#ffd166";
            ctx.shadowBlur = 22;
          }
          drawLotus(14, -pad.r * 0.26, pad.r * 0.18, glow, state.won);
          ctx.restore();
        });
      }

      function drawLotus(x, y, size, glow, openAll) {
        const open = openAll ? 1 : Math.min(1, 0.45 + glow * 0.55);
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = glow > 0 || openAll ? "#ffd166" : "#f4a7c6";
        for (let i = 0; i < 6; i++) {
          ctx.save();
          ctx.rotate((Math.PI * 2 / 6) * i);
          ctx.beginPath();
          ctx.ellipse(0, -size * open, size * 0.42, size, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle = "#fff0a6";
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.34, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawDragonflies(time) {
        state.dragonflies.forEach((fly, i) => {
          const x = (fly.x + time * fly.speed * 0.025) % (state.width + 60) - 30;
          const y = fly.y + Math.sin(time * 0.002 + fly.phase) * 14;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(Math.sin(time * 0.003 + i) * 0.2);
          ctx.strokeStyle = "#22543d";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-8, 0);
          ctx.lineTo(12, 0);
          ctx.stroke();
          ctx.fillStyle = "rgba(216, 243, 220, 0.56)";
          ctx.beginPath();
          ctx.ellipse(-2, -5, 11, 4, -0.38, 0, Math.PI * 2);
          ctx.ellipse(2, 5, 11, 4, 0.38, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }

      function drawFireflies(time) {
        state.fireflies.forEach((bug, i) => {
          const show = state.won || !bug.win;
          if (!show) return;
          const x = (bug.x + Math.sin(time * 0.001 * bug.speed + bug.phase) * 26 + state.width) % state.width;
          const y = bug.y + Math.cos(time * 0.0012 * bug.speed + i) * 16;
          const alpha = 0.25 + Math.sin(time * 0.005 + bug.phase) * 0.22 + (state.won ? 0.28 : 0);
          ctx.fillStyle = `rgba(255, 241, 118, ${Math.max(0.12, alpha)})`;
          ctx.beginPath();
          ctx.arc(x, y, state.won ? 3.2 : 2.2, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function drawFrog(time) {
        if (state.splash && time - state.splash.start < 420) return;
        const f = state.frog;
        const breath = 1 + Math.sin(time * 0.004) * 0.025;
        const blink = Math.sin(time * 0.0017) > 0.985;
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.scale(f.facing, 1);
        ctx.scale(breath * f.scale, (2 - breath) * f.scale);

        ctx.fillStyle = "#38b000";
        ctx.beginPath();
        ctx.ellipse(-20, 28, 18, 11, -0.24, 0, Math.PI * 2);
        ctx.ellipse(20, 28, 18, 11, 0.24, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#70e000";
        ctx.beginPath();
        ctx.ellipse(0, 7, 31, 34, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ccff33";
        ctx.beginPath();
        ctx.ellipse(0, 14, 18, 20, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#70e000";
        ctx.beginPath();
        ctx.arc(-18, -17, 14, 0, Math.PI * 2);
        ctx.arc(18, -17, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffe66d";
        ctx.beginPath();
        ctx.arc(-18, -18, 8, 0, Math.PI * 2);
        ctx.arc(18, -18, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#183c32";
        ctx.lineWidth = 2;
        if (state.frog.dizzy) {
          drawSwirl(-18, -18);
          drawSwirl(18, -18);
        } else if (blink) {
          ctx.beginPath();
          ctx.moveTo(-25, -18);
          ctx.lineTo(-11, -18);
          ctx.moveTo(11, -18);
          ctx.lineTo(25, -18);
          ctx.stroke();
        } else {
          ctx.fillStyle = "#183c32";
          ctx.beginPath();
          ctx.arc(-18, -18, 3.2, 0, Math.PI * 2);
          ctx.arc(18, -18, 3.2, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.strokeStyle = "#216b36";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0.22, Math.PI - 0.22);
        ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.32)";
        ctx.beginPath();
        ctx.ellipse(-10, -1, 7, 4, -0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawSwirl(x, y) {
        ctx.beginPath();
        for (let a = 0; a < Math.PI * 2.6; a += 0.22) {
          const r = a * 1.05;
          const px = x + Math.cos(a) * r;
          const py = y + Math.sin(a) * r;
          if (a === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }

      function drawSplash(time) {
        if (!state.splash) return;
        const age = time - state.splash.start;
        if (age > 1200) return;
        const p = Math.min(1, age / 800);
        const x = state.splash.x;
        const y = state.splash.y;
        ctx.save();
        ctx.strokeStyle = `rgba(216, 243, 220, ${1 - p})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(x, y, 26 + p * 82, 9 + p * 18, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = `rgba(216, 243, 220, ${Math.max(0, 0.85 - p)})`;
        for (let i = 0; i < 22; i++) {
          const angle = (Math.PI * 2 / 22) * i;
          const dist = 14 + p * (42 + (i % 5) * 9);
          const dropX = x + Math.cos(angle) * dist;
          const dropY = y - Math.abs(Math.sin(angle)) * (18 + p * 68) + p * 46;
          ctx.beginPath();
          ctx.arc(dropX, dropY, Math.max(1, 4 - p * 2.8), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawFireworks(time) {
        if (!state.fireworks.length) return;
        state.fireworks = state.fireworks.filter((burst) => time - burst.start < 1200);
        state.fireworks.forEach((burst) => {
          const age = time - burst.start;
          const p = Math.min(1, age / 1200);
          ctx.save();
          ctx.globalAlpha = 1 - p;
          burst.particles.forEach((dot) => {
            const x = burst.x + Math.cos(dot.angle) * dot.speed * p;
            const y = burst.y + Math.sin(dot.angle) * dot.speed * p + p * p * 36;
            ctx.fillStyle = dot.color;
            ctx.beginPath();
            ctx.arc(x, y, dot.size * (1 - p * 0.45), 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.restore();
        });
      }

      function makeFirework(x, y) {
        const colors = ["#ffd166", "#f4a7c6", "#b7e4c7", "#74c69d", "#ffcad4"];
        state.fireworks.push({
          x,
          y,
          start: performance.now(),
          particles: Array.from({ length: 28 }, (_, i) => ({
            angle: (Math.PI * 2 / 28) * i,
            speed: 42 + Math.random() * 72,
            size: 2 + Math.random() * 2.6,
            color: colors[i % colors.length]
          }))
        });
      }

      function updateJump(time) {
        if (!state.jump) return;
        const jump = state.jump;
        const p = Math.min(1, (time - jump.start) / jump.duration);
        const eased = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        state.frog.x = jump.from.x + (jump.to.x - jump.from.x) * eased;
        state.frog.y = jump.from.y + (jump.to.y - jump.from.y) * eased - Math.sin(Math.PI * p) * jump.arc;
        state.frog.scale = 1 + Math.sin(Math.PI * p) * 0.13;

        if (p >= 1) {
          state.frog.x = jump.to.x;
          state.frog.y = jump.to.y;
          state.frog.scale = 1;
          state.jump = null;
          if (jump.onDone) jump.onDone();
        }
      }

      function jumpTo(target, onDone) {
        const from = { x: state.frog.x, y: state.frog.y };
        const dx = target.x - from.x;
        state.frog.facing = dx >= 0 ? 1 : -1;
        state.jump = {
          from,
          to: target,
          arc: Math.max(70, Math.min(128, Math.abs(dx) * 0.33)),
          start: performance.now(),
          duration: 760,
          onDone
        };
      }

      function renderQuestion() {
        const current = gameQuestions[state.index];
        if (!current || state.gameOver || state.won) return;
        state.locked = false;
        questionCard.classList.remove("is-shaking");
        questionKicker.textContent = `Nhảy đến lá sen số ${state.index + 1}`;
        questionText.textContent = current.text;
        optionsBox.innerHTML = "";
        current.options.forEach((option) => {
          const button = document.createElement("button");
          button.className = "frog-option";
          button.type = "button";
          button.dataset.key = option.key;
          button.innerHTML = `<i>${option.key}</i><span>${option.text}</span><b class="frog-mark"></b>`;
          button.addEventListener("click", () => chooseAnswer(button, current));
          optionsBox.appendChild(button);
        });
      }

      function updateProgress() {
        dots.forEach((dot, i) => dot.classList.toggle("is-filled", i < state.index));
      }

      function chooseAnswer(button, current) {
        if (state.locked || state.gameOver || state.won) return;
        state.locked = true;
        Array.from(optionsBox.children).forEach((item) => { item.disabled = true; });
        const selected = button.dataset.key;
        const correct = selected === current.correct;

        if (correct) {
          button.classList.add("is-correct");
          button.querySelector(".frog-mark").textContent = "✓";
          state.correct += 1;
          state.bloom = state.index;
          state.bloomStart = performance.now();
          const pad = px(lilyPads[state.index]);
          jumpTo({ x: pad.x, y: pad.y - pad.r * 0.72 }, () => {
            state.index += 1;
            updateProgress();
            state.splash = { x: state.frog.x, y: state.frog.y + 28, start: performance.now() };
            if (state.index >= gameQuestions.length) {
              setTimeout(winGame, 520);
            } else {
              setTimeout(renderQuestion, 520);
            }
          });
          return;
        }

        button.classList.add("is-wrong");
        button.querySelector(".frog-mark").textContent = "×";
        questionCard.classList.add("is-shaking");
        state.frog.dizzy = true;
        state.gameOver = true;
        state.splash = { x: state.frog.x + 18 * state.frog.facing, y: state.frog.y + 30, start: performance.now() };
        setTimeout(() => showResult(false), 1050);
      }

      function winGame() {
        const target = { x: 1112 / 1180 * state.width, y: 278 / 500 * state.height };
        jumpTo(target, () => {
          state.won = true;
          for (let i = 0; i < 5; i++) {
            setTimeout(() => makeFirework(300 + Math.random() * (state.width - 520), 92 + Math.random() * 150), i * 230);
          }
          setTimeout(() => showResult(true), 1250);
        });
      }

      function showResult(success) {
        const percent = Math.round((state.correct / gameQuestions.length) * 100);
        const stars = success ? 3 : percent >= 60 ? 2 : 1;
        resultTitle.textContent = success ? "Hoàn thành!" : "GAME OVER";
        resultText.textContent = success
          ? `Bạn đã giúp ếch sang bờ với ${state.correct}/${gameQuestions.length} câu đúng.`
          : `Ếch rơi xuống nước rồi. Bạn đúng ${state.correct}/${gameQuestions.length} câu.`;
        resultStars.innerHTML = "★".repeat(stars) + "☆".repeat(3 - stars);
        overlay.classList.add("is-visible");
      }

      function resetGame() {
        state.index = 0;
        state.correct = 0;
        state.jump = null;
        state.splash = null;
        state.bloom = -1;
        state.won = false;
        state.gameOver = false;
        state.locked = false;
        state.fireworks = [];
        state.frog.dizzy = false;
        overlay.classList.remove("is-visible");
        updateProgress();
        positionFrog();
        renderQuestion();
      }

      function loop(time) {
        updateJump(time);
        drawScene(time);
        requestAnimationFrame(loop);
      }

      window.addEventListener("resize", fitCanvas);
      playAgain.addEventListener("click", resetGame);
      fitCanvas();
      seedAmbient();
      renderQuestion();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
